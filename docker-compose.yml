# BookmarkHub 2
# Start/update:  docker compose up -d --build
# Data (users.json, bookmarks.json, favicon cache) lives in ./data on the host.
services:
  bookmarkhub:
    build: .
    image: bookmarkhub:2.0.1
    container_name: bookmarkhub
    restart: unless-stopped
    ports:
      - "3131:3131"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Berlin
      # Optional: Secure cookie flag. "auto" = only when the request arrives via HTTPS
      # (Synology reverse proxy sends X-Forwarded-Proto). Set to "true" to always require HTTPS.
      - COOKIE_SECURE=auto
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
